<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EcoPack Material Recommender</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
      body {
        background: radial-gradient(circle at top left, #e8f5e9 0, #f5f7fa 45%, #e3f2fd 100%);
      }
      .navbar-brand {
        font-weight: 600;
      }
      .hero-title {
        font-size: 2rem;
        font-weight: 700;
        color: #2e7d32;
      }
      .hero-subtitle {
        color: #555;
      }
      .card-shadow {
        box-shadow: 0 0.25rem 0.75rem rgba(0, 0, 0, 0.05);
      }
      .badge-score {
        font-size: 0.8rem;
      }
      .text-purple {
        color: #6a1b9a !important;
      }
      .metric-card {
        border-radius: 1rem;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }
      .metric-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 0.75rem 1.5rem rgba(0, 0, 0, 0.08);
      }
      .chart-card {
        border-radius: 1rem;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }
      .chart-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 0.75rem 1.25rem rgba(0, 0, 0, 0.06);
      }
      .dashboard-hero {
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 0.5rem 1.5rem rgba(46, 125, 50, 0.08);
        padding: 1.5rem 1.75rem;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="/ui">EcoPack Recommender</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="/ui">Material Recommendation</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/dashboard">Analytics Dashboard</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container mb-5">
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
